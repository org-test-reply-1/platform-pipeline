name: ARC Runner Image — Build & Deploy

# -----------------------------------------------------------------------
# Trigger manuale. Permette di scegliere quale runner deployare:
#   - "all"            → builda e deploya tutti i runner (arc-runner-*)
#   - "<nome-cartella>" → builda e deploya solo quel runner
# -----------------------------------------------------------------------

on:
  push:
    branches:
      - main
    paths:
      - "arc-runner-*/Dockerfile"
      - "arc-runner-*/values.yaml"

  workflow_dispatch:
    inputs:
      runner_name:
        description: "Nome del runner da deployare (deve corrispondere al nome della cartella, es. arc-runner-image). Usa 'all' per deployarli tutti."
        required: true
        default: "all"
      image_tag:
        description: "Tag immagine da forzare (lascia vuoto per SHA commit)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ===================================================================== #
  # JOB 0 — Determina quali runner buildare
  # ===================================================================== #
  resolve-runners:
    name: Resolve runners to deploy
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determina matrice runner
        id: set-matrix
        run: |
          RUNNER_INPUT="${{ inputs.runner_name }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            # Trova quali cartelle arc-runner-* hanno file modificati nel push
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
              | grep -oP '^arc-runner-[^/]+' \
              | sort -u)

            if [ -z "$CHANGED" ]; then
              echo "::error::Nessuna cartella arc-runner-* modificata nel push."
              exit 1
            fi

            RUNNERS=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          elif [ -z "$RUNNER_INPUT" ] || [ "$RUNNER_INPUT" = "all" ]; then
            # workflow_dispatch con "all": trova tutte le cartelle arc-runner-*
            RUNNERS=$(ls -d arc-runner-*/ 2>/dev/null | sed 's|/||' | jq -R -s -c 'split("\n") | map(select(length > 0))')

          else
            # workflow_dispatch con nome specifico
            if [ ! -d "$RUNNER_INPUT" ]; then
              echo "::error::La cartella '$RUNNER_INPUT' non esiste!"
              exit 1
            fi
            RUNNERS=$(echo "[\"$RUNNER_INPUT\"]")
          fi

          echo "matrix={\"runner\":$RUNNERS}" >> "$GITHUB_OUTPUT"
          echo "Runner da deployare: $RUNNERS"

  # ===================================================================== #
  # JOB 1 — Build e Push (matrice dinamica)
  # ===================================================================== #
  build-runner-image:
    name: "Build & Push — ${{ matrix.runner }}"
    needs: resolve-runners
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-runners.outputs.matrix) }}

    outputs:
      image_full_tag: ${{ steps.build.outputs.image_full_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build e Push immagine runner
        id: build
        uses: org-test-reply-1/platform-actions/docker-build-push@main
        with:
          registry: ghcr.io
          image_name: org-test-reply-1/${{ matrix.runner }}
          image_tag: ${{ inputs.image_tag }}
          dockerfile_path: ./${{ matrix.runner }}/Dockerfile
          context_path: ./${{ matrix.runner }}
          app_id: ${{ secrets.ARC_GITHUB_APP_ID }}
          app_private_key: ${{ secrets.ARC_GITHUB_APP_PRIVATE_KEY }}
          app_installation_id: ${{ secrets.ARC_GITHUB_APP_INSTALLATION_ID }}

  # ===================================================================== #
  # JOB 2 — Deploy su AKS tramite Reusable Workflow (matrice dinamica)
  # ===================================================================== #
  deploy-arc:
    name: "Deploy ARC — ${{ matrix.runner }}"
    needs: [resolve-runners, build-runner-image]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve-runners.outputs.matrix) }}
    uses: org-test-reply-1/platform-workflows/.github/workflows/deploy-arc.yml@main
    with:
      image_full_tag: ghcr.io/org-test-reply-1/${{ matrix.runner }}:${{ inputs.image_tag || github.sha }}
      arc_runner_set_name: ${{ matrix.runner }}
      arc_namespace: arc-runners
      arc_system_namespace: arc-system
      github_config_url: "https://github.com/org-test-reply-1"
      values_yaml_path: ./${{ matrix.runner }}/values.yaml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
      ARC_GITHUB_APP_ID: ${{ secrets.ARC_GITHUB_APP_ID }}
      ARC_GITHUB_APP_INSTALLATION_ID: ${{ secrets.ARC_GITHUB_APP_INSTALLATION_ID }}
      ARC_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ARC_GITHUB_APP_PRIVATE_KEY }}
