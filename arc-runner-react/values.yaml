githubConfigSecret: arc-github-secret
runnerScaleSetName: "arc-runner-react"

minRunners: 1
maxRunners: 10

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/org-test-reply-1/arc-runner-react:latest
        command:
          - /home/runner/run.sh
